# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: lint.yaml

permissions: read-all

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. Protected branches
  # are exempt, so a release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  # A change that ships must carry its NEWS entry as a news/<branch>.md
  # fragment. Entries live in their own files so open pull requests stop
  # conflicting at the top of NEWS.md, which also means a forgotten one is no
  # longer a missing line in a diff anyone reads. Ships nothing (the base
  # branch's .Rbuildignore covers every file) and the bump (Version: moved, or
  # fragments collected) both pass. Python only, no R, so it takes seconds.
  news-fragment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the base branch, to diff against

      - name: Test the fragment tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_news.py'

      - name: A change that ships carries a news/ fragment
        run: python3 .github/scripts/news.py check --base "origin/${{ github.base_ref }}"
