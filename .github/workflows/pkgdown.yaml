# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  # A commit that only touches the generated house-style artifact cannot change
  # the package: .claude is in .Rbuildignore, so it never reaches the build.
  # Running this on such a commit burns runner minutes and queues ahead of
  # checks that can actually fail.
  push:
    paths-ignore:
      - '.claude/**'
    branches: [main, master]
  pull_request:
    paths-ignore:
      - '.claude/**'
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        # dest_dir is passed explicitly: build_site_github_pages() defaults it
        # to "docs", which OVERRIDES the `destination:` in _pkgdown.yml. This
        # repo's docs/ holds plans/ and specs/, and pkgdown rightly refuses to
        # build over a directory it did not create.
        run: >
          pkgdown::build_site_github_pages(dest_dir = "pkgdown-site",
                                           new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: pkgdown-site
