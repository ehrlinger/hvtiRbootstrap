# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Builds the PDF manual with TinyTeX, using --as-cran WITHOUT --no-manual.
# This is the step that catches raw Unicode in .Rd files (Greek letters,
# combining marks) that --no-manual skips in silence. Runs on pushes to the
# default branch rather than on pull requests, because building the manual
# is slow -- a direct push to the default branch triggers it too, not just
# a merge.
on:
  # A commit that only touches the generated house-style artifact cannot change
  # the package: .claude is in .Rbuildignore, so it never reaches the build.
  # Running this on such a commit burns runner minutes and queues ahead of
  # checks that can actually fail.
  push:
    paths-ignore:
      - '.claude/**'
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: check-manual.yaml

permissions: read-all

jobs:
  check-manual:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'
